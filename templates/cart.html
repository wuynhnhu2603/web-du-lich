<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - ViVu Viet</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="../static/cart.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function ConfirmModal({ isOpen, onClose, onConfirm, tourName }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[9999] p-4">
                    <div className="bg-white rounded-[24px] p-8 max-w-sm w-full text-center shadow-2xl animate-slideUp">
                        <div className="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                            <i className="fa-solid fa-trash-can text-2xl"></i>
                        </div>
                        <h3 className="text-xl font-bold mb-2 text-slate-800">Xóa tour?</h3>
                        <p className="text-gray-500 mb-6 text-sm">Bạn có chắc muốn bỏ tour <span className="font-bold">{tourName}</span>?</p>
                        <div className="flex gap-3">
                            <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-gray-600">Hủy</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-red-500 font-bold text-white shadow-lg">Xóa ngay</button>
                        </div>
                    </div>
                </div>
            );
        }

        function CartApp() {
            const [cart, setCart] = useState([]);
            const [modal, setModal] = useState({ open: false, id: null, name: '' });

            useEffect(() => {
                const data = JSON.parse(localStorage.getItem('cart')) || [];
                setCart(data);
            }, []);

            const totalPrice = useMemo(() => {
                return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            }, [cart]);

            const updateQty = (id, delta) => {
                const newCart = cart.map(item => 
                    item.id === id ? { ...item, quantity: Math.max(1, item.quantity + delta) } : item
                );
                setCart(newCart);
                localStorage.setItem('cart', JSON.stringify(newCart));
            };

            const confirmDelete = () => {
                const newCart = cart.filter(item => item.id !== modal.id);
                setCart(newCart);
                localStorage.setItem('cart', JSON.stringify(newCart));
                setModal({ open: false, id: null, name: '' });
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-10 lg:py-16 min-h-screen">
                    <div className="flex items-center justify-between mb-10 pb-6 border-b border-gray-100">
                        <div className="flex items-center gap-3">
                           <a href="home.html" className="w-10 h-10 btn-vivu rounded-full flex items-center justify-center text-white hover:scale-110 transition">
                                <i className="fa-solid fa-chevron-left text-sm"></i>
                            </a>
                            <h1 className="text-2xl font-bold text-slate-800">Thông tin đặt chỗ</h1>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        <div className="lg:col-span-8 space-y-6">
                            {cart.length === 0 ? (
                                <div className="vivu-card p-16 text-center">
                                    <p className="text-gray-400">Giỏ hàng đang trống.</p>
                                </div>
                            ) : cart.map(item => (
                                <div key={item.id} className="vivu-card p-6 flex flex-col sm:flex-row gap-6 border border-transparent hover:border-[#43dfd0]/30 transition-all">
                                    <img src={item.image} className="w-full sm:w-40 h-32 object-cover rounded-xl shadow-sm" />
                                    <div className="flex-1 flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-800 mb-1">{item.name}</h3>
                                            <div className="flex items-center text-gray-500 text-xs gap-4">
                                                <span><i className="fa-solid fa-clock mr-1 text-[#43dfd0]"></i>{item.duration}</span>
                                                <span><i className="fa-solid fa-location-dot mr-1 text-[#43dfd0]"></i>{item.location}</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-50">
                                            <div className="flex items-center bg-gray-50 rounded-full p-1 border">
                                                <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition text-gray-400">
                                                    <i className="fa-solid fa-minus text-[10px]"></i>
                                                </button>
                                                <span className="w-10 text-center font-bold text-slate-700">{item.quantity}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition text-gray-400">
                                                    <i className="fa-solid fa-plus text-[10px]"></i>
                                                </button>
                                            </div>
                                            <button onClick={() => setModal({ open: true, id: item.id, name: item.name })} className="text-red-300 hover:text-red-500 transition text-sm">
                                                <i className="fa-solid fa-trash-can"></i> Xóa
                                            </button>
                                        </div>
                                    </div>
                                    <div className="text-right flex flex-col justify-end sm:min-w-[150px]">
                                        <p className="text-2xl font-bold text-[#43dfd0]">{ (item.price * item.quantity).toLocaleString() }đ</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="lg:col-span-4 sticky top-10">
                            <div className="vivu-card p-8">
                                <h2 className="text-xl font-bold text-slate-800 mb-8 border-b pb-5">Tóm tắt chuyến đi</h2>
                                <div className="space-y-4 mb-8">
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Tạm tính ({cart.length} tour)</span>
                                        <span className="font-bold text-slate-800">{totalPrice.toLocaleString()}đ</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Phí dịch vụ</span>
                                        <span className="text-green-500 font-bold">Miễn phí</span>
                                    </div>
                                </div>
                                <div className="border-t border-dashed border-gray-300 my-8"></div>
                                <div className="flex justify-between items-center mb-10">
                                    <span className="font-bold text-lg">Tổng cộng</span>
                                    <div className="text-right">
                                        <p className="text-3xl font-black text-[#43dfd0]">{totalPrice.toLocaleString()}đ</p>
                                        <p className="text-[10px] text-gray-400 uppercase mt-1">Đã bao gồm VAT</p>
                                    </div>
                                </div>
                                <button className="w-full btn-vivu text-white py-4.5 rounded-2xl font-bold text-lg shadow-lg">
                                    Tiến hành thanh toán
                                </button>
                            </div>
                        </div>
                    </div>

                    <ConfirmModal 
                        isOpen={modal.open} 
                        onClose={() => setModal({ open: false, id: null, name: '' })} 
                        onConfirm={confirmDelete}
                        tourName={modal.name}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CartApp />);
    </script>
</body>
</html>
